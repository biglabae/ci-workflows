name: Build and Deploy to Kubernetes

on:
  workflow_call:
    inputs:
      registry: { required: true, type: string }
      k8s_cluster_name: { required: true, type: string }
      k8s_namespace: { required: true, type: string }
      k8s_job_name: { required: false, type: string }
      job: { required: true, type: string }
      build_args: { required: false, type: string, default: "" }
      prebuild: { required: false, type: boolean, default: false }
    secrets:
      do_api_token: { required: true }

permissions:
  contents: read

jobs:
  job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to DigitalOcean Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ inputs.registry }}
          username: doctl
          password: ${{ secrets.do_api_token }}

      - name: Set image tag
        id: set-tag
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set project context and Dockerfile path
        id: meta
        shell: bash
        run: |
          DOCKERFILE=${{ inputs.job }}/Dockerfile.production

          if [[ "${{ inputs.k8s_job_name }}" == "" ]]; then
            BASE_IMAGE=$(basename "${GITHUB_REPOSITORY}")
          else
            BASE_IMAGE=${{ inputs.k8s_job_name }}
          fi

          BASE_JOB=${BASE_IMAGE}-${{ inputs.job }}
          JOB=${BASE_JOB}-${{ steps.set-tag.outputs.tag }}

          echo "context=${{ inputs.job }}" >> "$GITHUB_OUTPUT"
          echo "dockerfile=${DOCKERFILE}" >> "$GITHUB_OUTPUT"
          echo "image=${{ inputs.registry }}/${{ inputs.k8s_namespace }}/${JOB}" >> "$GITHUB_OUTPUT"
          echo "base_job=${BASE_JOB}" >> "$GITHUB_OUTPUT"
          echo "job=${JOB}" >> "$GITHUB_OUTPUT"

          {
            echo "build_args<<BUILDARGSEOF"
            echo "${{ inputs.build_args }}"
            if ${{ inputs.prebuild }}; then
              echo "PREBUILD_IMAGE=${{ inputs.registry }}/${{ inputs.k8s_namespace }}/${BASE_IMAGE}:${{ steps.set-tag.outputs.tag }}"
            fi
            echo "BUILDARGSEOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: ${{ steps.meta.outputs.context }}
          file: ${{ steps.meta.outputs.dockerfile }}
          build-args: ${{ steps.meta.outputs.build_args }}
          push: true
          tags: ${{ steps.meta.outputs.image }}:${{ steps.set-tag.outputs.tag }}
          cache-from: type=registry,ref=${{ steps.meta.outputs.image }}:buildcache
          cache-to: type=registry,ref=${{ steps.meta.outputs.image }}:buildcache,mode=max

      - name: Install doctl
        uses: digitalocean/action-doctl@3cb3953159719656269e044e0e24ca16dd2a690f # v2.5.2
        with:
          token: ${{ secrets.do_api_token }}

      - name: Fetch kubeconfig
        run: doctl kubernetes cluster kubeconfig save ${{ inputs.k8s_cluster_name }}

      - name: Get existing job spec
        run: |
          kubectl get job ${{ steps.meta.outputs.base_job }} --namespace=${{ inputs.k8s_namespace }} -o yaml > job.yaml

      - name: Patch job spec with new name and image
        run: |
          yq e '
            .metadata.name = "${{ steps.meta.outputs.job }}" |
            .spec.template.spec.containers[0].image = "${{ steps.meta.outputs.image }}:${{ steps.set-tag.outputs.tag }}" |

            del(
              .metadata.uid,
              .metadata.resourceVersion,
              .metadata.creationTimestamp,
              .metadata.managedFields,
              .metadata.ownerReferences,
              .status,
              .spec.selector,
              .spec.template.metadata.labels."job-name",
              .spec.template.metadata.labels."batch.kubernetes.io/job-name",
              .spec.template.metadata.labels."controller-uid",
              .spec.template.metadata.labels."batch.kubernetes.io/controller-uid"
            ) |

            .spec.ttlSecondsAfterFinished = 3600
          ' -i job.yaml

      - name: Apply new job
        run: |
          kubectl delete job ${{ steps.meta.outputs.job }} --namespace=${{ inputs.k8s_namespace }} --ignore-not-found
          kubectl apply -f job.yaml --namespace=${{ inputs.k8s_namespace }}

      - name: Wait for job completion
        id: runjob
        continue-on-error: true
        run: |
          kubectl wait --for=condition=complete job/${{ steps.meta.outputs.job }} \
            --namespace=${{ inputs.k8s_namespace }} --timeout=180s

      - name: Stream job logs
        run: |
          kubectl logs job/${{ steps.meta.outputs.job }} --namespace=${{ inputs.k8s_namespace }}

      - name: Fail pipeline if job not complete
        if: steps.runjob.outcome == 'failure'
        run: exit 1
